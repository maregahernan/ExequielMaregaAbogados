<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Próximamente</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --rojo: #cc1414;
      --amarillo: #f5c800;
      --blanco: #ffffff;
      --gris: #f0f0f0;
    }

    body {
      background-color: var(--gris);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== HEADER ===== */
    header {
      width: 100%;
      background: var(--blanco);
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      overflow: hidden;
      position: relative;
    }

    .header-img-wrap {
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    .header-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* ===== CONTENIDO ===== */
    .contenido {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 24px 48px;
      text-align: center;
      gap: 18px;
    }

    .linea-decorativa {
      width: 60px;
      height: 4px;
      background: var(--rojo);
      border-radius: 2px;
      margin: 0 auto;
    }

    h3.proximamente {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2rem, 6vw, 3.4rem);
      color: var(--rojo);
      letter-spacing: 0.04em;
      line-height: 1.1;
      animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) both;
    }

    .sub {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      color: #888;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      animation: fadeUp 1.1s 0.15s cubic-bezier(.22,1,.36,1) both;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amarillo);
      margin: 0 4px;
      animation: pulse 1.4s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* ===== ANIMACIONES ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50%       { transform: scale(1.5); opacity: 1; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .header-img-wrap {
        max-width: 100%;
      }

      .contenido {
        padding: 36px 16px 32px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-img-wrap">
      <img src="CV.jpeg" alt="Mejor llámalo al ruso" />
    </div>
  </header>

  <section class="contenido">
    <div class="linea-decorativa"></div>
    <h3 class="proximamente">Próximamente...</h3>
    <p class="sub">Algo grande está por llegar</p>
    <div>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </section>

</body>
</html>
